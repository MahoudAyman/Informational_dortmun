<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="512" height="512" fill="#0A1628"/>
    <defs>
      <linearGradient id="goldGrad_512" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF2A3" />
        <stop offset="35%" stop-color="#E5B94E" />
        <stop offset="70%" stop-color="#D4A843" />
        <stop offset="100%" stop-color="#9E7820" />
      </linearGradient>
      <linearGradient id="shieldGrad_512" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#182E4B" />
        <stop offset="100%" stop-color="#08121E" />
      </linearGradient>
      <filter id="glow_512" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4A843" flood-opacity="0.45" />
      </filter>
    </defs>
    <g transform="translate(31, 31) scale(4.5)">
      <!-- Outer Hexagonal Shield -->
      <polygon points="50,4 94,26 94,74 50,96 6,74 6,26" fill="url(#shieldGrad_512)" stroke="url(#goldGrad_512)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow_512)" />
      
      <!-- Inner Dashed Construction Contour -->
      <polygon points="50,13 86,30 86,70 50,87 14,70 14,30" fill="none" stroke="#D4A843" stroke-width="1.4" stroke-opacity="0.6" stroke-dasharray="4 2.5" />
      
      <!-- Construction Crane / Letter D Monogram -->
      <path d="M30 28 H56 C69 28 76 37 76 50 C76 63 69 72 56 72 H30 V28 Z" fill="none" stroke="url(#goldGrad_512)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M42 41 H53 C58 41 62 44.5 62 50 C62 55.5 58 59 53 59 H42 V41 Z" fill="url(#goldGrad_512)" />
      
      <!-- Heavy Crane Lift Hook Element -->
      <path d="M50 15 L50 28" stroke="url(#goldGrad_512)" stroke-width="4" stroke-linecap="round" />
      <circle cx="50" cy="15" r="3.5" fill="#FFF2A3" />
